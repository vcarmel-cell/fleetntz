<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F4">
<title>הדרי ניצנים · צי רכב</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#FBFBF9; --wash:#F3F3EF; --ink:#24292C; --ink-soft:#5F666A; --ink-grey:#959B9E;
    --hairline:#E1E2DD; --acc:#1F5F7A; --acc-hover:#174A60; --acc-wash:#E6EEF2;
    --ok:#3F7D53; --ok-wash:#EAF3EC; --warn:#9A6A1E; --warn-wash:#FBF2E1; --bad:#B23B2E; --bad-wash:#FBECE9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:15px;}
  a{color:var(--acc);}
  button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
  input,select,textarea{border:1px solid var(--hairline);border-radius:3px;padding:8px 10px;background:#fff;width:100%;}
  textarea{min-height:64px;resize:vertical;}
  input[type=checkbox]{width:auto;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px;}
  .btn{background:#fff;border:1px solid var(--hairline);border-radius:2px;padding:8px 14px;cursor:pointer;white-space:nowrap;}
  .btn:hover{border-color:var(--ink-soft);}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500;}
  .btn.primary:hover{background:var(--acc-hover);}
  .btn.link{border:none;background:none;padding:4px 6px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px;}
  .btn.danger{color:var(--bad);}
  .btn.sm{padding:5px 10px;font-size:13px;}
  .lnk{background:none;border:none;padding:0;font:inherit;color:inherit;text-align:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--ink-grey);text-underline-offset:3px;}
  .lnk:hover{color:var(--acc);text-decoration-color:currentColor;}
  .hidden{display:none !important;}

  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .login-box{width:100%;max-width:360px;background:var(--wash);border:1px solid var(--hairline);border-radius:4px;padding:26px;}
  .login-box h1{margin:0 0 4px;font-size:21px;display:flex;align-items:center;justify-content:center;gap:10px;}
  .login-box p{text-align:center;margin:0 0 18px;color:var(--ink-soft);font-size:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:4px;}
  .field.chk label{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;margin-top:24px;}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin:4px 0 8px;}

  header{border-bottom:1px solid var(--hairline);background:var(--wash);}
  .bar{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;min-width:0;}
  .brand svg{flex:none;}
  .brand small{display:block;font-weight:400;font-size:12px;color:var(--ink-soft);}
  .who{margin-inline-start:auto;font-size:13px;color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  main{max-width:1180px;margin:0 auto;padding:16px 16px 40px;}
  .tabs{display:flex;border-bottom:1px solid var(--hairline);margin-bottom:16px;overflow-x:auto;}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;color:var(--ink-soft);font-size:15px;white-space:nowrap;}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600;}
  .tab .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:6px;font-size:11px;line-height:18px;background:var(--bad);color:#fff;border-radius:2px;text-align:center;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
  .card{background:var(--wash);border:1px solid var(--hairline);border-radius:3px;padding:12px 14px;}
  .card .k{font-size:12px;color:var(--ink-soft);}
  .card .v{font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;}
  .card.alert .v{color:var(--bad);}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .toolbar input,.toolbar select{width:auto;min-width:150px;flex:1 1 150px;max-width:260px;}
  .toolbar .sp{flex:1 1 0;}
  .toolbar .dt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);white-space:nowrap;}
  .toolbar .dt input{min-width:0;width:150px;flex:none;}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--hairline);border-radius:3px;margin-bottom:8px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--hairline);white-space:nowrap;}
  th{background:var(--wash);font-weight:600;font-size:13px;color:var(--ink-soft);}
  tr:last-child td{border-bottom:none;}
  tr.total td{font-weight:700;background:var(--wash);}
  td.num,th.num{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;}
  td.wrap{white-space:normal;min-width:180px;}
  .plate{display:inline-block;direction:ltr;font-variant-numeric:tabular-nums;font-weight:600;background:#F6D44A;color:#1d1d1d;border:1px solid #c9ab2c;border-radius:2px;padding:1px 7px;font-size:13px;letter-spacing:.5px;}
  .sub{font-size:12px;color:var(--ink-grey);}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:2px;white-space:nowrap;}
  .tag.ok{background:var(--ok-wash);color:var(--ok);}
  .tag.warn{background:var(--warn-wash);color:var(--warn);}
  .tag.bad{background:var(--bad-wash);color:var(--bad);}
  .tag.neu{background:#ECEDEA;color:var(--ink-soft);}
  .tag.blue{background:var(--acc-wash);color:var(--acc);}
  /* validity bands: expired / ≤30 / 31–60 / >60 days */
  .xp{display:inline-flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2;}
  .xp .sub{font-variant-numeric:tabular-nums;}
  .b{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border:1px solid;border-radius:2px;white-space:nowrap;}
  .b.exp{background:#FBE3DF;color:#A3271B;border-color:#EBB0A7;}
  .b.urg{background:#FDEDE3;color:#B4470F;border-color:#F2C2A3;}
  .b.soon{background:#FDF5DA;color:#7F5B00;border-color:#E7D08A;}
  .b.ok{background:#E8F4EC;color:#2F6E43;border-color:#B9D9C3;}
  .cards.bands{grid-template-columns:repeat(4,minmax(0,1fr));}
  .card.pick{cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%;}
  .card.pick:hover{border-color:var(--ink-grey);}
  .card.pick[aria-pressed="true"]{border:2px solid var(--acc);padding:11px 13px;background:#fff;}
  .card .v.exp{color:#A3271B;} .card .v.urg{color:#B4470F;} .card .v.soon{color:#7F5B00;} .card .v.ok{color:#2F6E43;}
  .segs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .seg{background:#fff;border:1px solid var(--hairline);border-radius:2px;padding:8px 14px;cursor:pointer;font-size:14px;white-space:nowrap;}
  .seg:hover{border-color:var(--ink-soft);}
  .seg[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;}
  td.note{white-space:normal;min-width:120px;max-width:220px;font-size:13px;color:var(--ink-soft);}
  @media (max-width:700px){ .cards.bands{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .empty{text-align:center;color:var(--ink-grey);padding:30px 10px;}
  .row-actions{display:flex;gap:2px;}
  h2{font-size:17px;margin:4px 0 12px;}
  h3{font-size:15px;margin:20px 0 8px;}
  .alerts{list-style:none;margin:0;padding:0;border:1px solid var(--hairline);border-radius:3px;}
  .alerts li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--hairline);}
  .alerts li:last-child{border-bottom:none;}
  .alerts li.bad{box-shadow:inset -3px 0 0 var(--bad);}
  .alerts li.warn{box-shadow:inset -3px 0 0 var(--warn);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

  dialog{border:1px solid var(--hairline);border-radius:4px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);color:var(--ink);}
  dialog.wide{width:min(980px,calc(100vw - 32px));}
  dialog::backdrop{background:rgba(24,28,30,.38);}
  .dlg-head{padding:14px 18px;border-bottom:1px solid var(--hairline);font-weight:600;font-size:16px;background:var(--wash);display:flex;align-items:center;gap:10px;}
  .dlg-body{padding:16px 18px;}
  .dlg-foot{padding:12px 18px;border-top:1px solid var(--hairline);display:flex;gap:8px;justify-content:flex-start;position:sticky;bottom:0;background:#fff;}
  .dlg-foot .sp{flex:1;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .grid2 .full{grid-column:1/-1;}
  .sec{font-size:13px;font-weight:600;color:var(--acc);grid-column:1/-1;margin:6px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--hairline);}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 18px;margin-bottom:12px;}
  .kv div{font-size:14px;}
  .kv span{display:block;font-size:12px;color:var(--ink-soft);}
  .hint{font-size:13px;color:var(--ink-soft);background:var(--wash);border-radius:2px;padding:8px 10px;margin-bottom:12px;}

  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:3px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px);}
  #toast.show{opacity:1;}
  footer{max-width:1180px;margin:0 auto;padding:16px;font-size:12px;color:var(--ink-grey);display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--hairline);}
  footer a{color:var(--ink-soft);}
  @media (max-width:700px){
    .grid2,.two{grid-template-columns:1fr;}
    .toolbar input,.toolbar select{max-width:none;}
    .brand small{display:none;}
  }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<script>
/* ---------- config ---------- */
const COMPANY = 'הדרי ניצנים';
firebase.initializeApp({
  apiKey: "AIzaSyDVu1NV3wDI4qfADqPugIUvrQ2IFygSraM",
  authDomain: "fleet-ntz-next1.firebaseapp.com",
  projectId: "fleet-ntz-next1",
  storageBucket: "fleet-ntz-next1.firebasestorage.app",
  messagingSenderId: "1024441751127",
  appId: "1:1024441751127:web:6ef295fa03780d481df512"
});
const auth = firebase.auth(), db = firebase.firestore();
const COLS = ['vehicles','drivers','assignments','services','expenses','documents'];
const S = {vehicles:[],drivers:[],assignments:[],services:[],expenses:[],documents:[]};
let user = null, tab = 'dash', unsubs = [];
const ui = {vq:'',vgrp:'',vband:'',vcorp:'',vtype:'',dq:'',sv:'',st:'',ev:'',ec:'',from:'',to:''};

const FUEL = {petrol:'בנזין',diesel:'סולר',hybrid:'היברידי',electric:'חשמלי'};
const VSTAT = {active:'פעיל',garage:'במוסך',inactive:'נמכר / מושבת'};
const OWN = {owned:'בבעלות',leasing:'ליסינג',rental:'השכרה'};
const STYPE = {periodic:'טיפול תקופתי',repair:'תיקון',tires:'צמיגים',test:'טסט שנתי',body:'פחחות / תאונה',other:'אחר'};
const ECAT = {fuel:'דלק',charge:'טעינה',toll:'כביש אגרה',parking:'חניה',fine:'דוח / קנס',wash:'שטיפה',insurance:'ביטוח',license:'אגרת רישוי',other:'אחר'};

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtD = s => s ? s.split('-').reverse().join('/') : '';
const daysTo = s => Math.round((new Date(s+'T00:00') - new Date(today()+'T00:00')) / 864e5);
const nf = new Intl.NumberFormat('he-IL',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('he-IL',{maximumFractionDigits:1});
const money = n => '₪' + new Intl.NumberFormat('he-IL',{maximumFractionDigits:2,minimumFractionDigits:0}).format(n||0);
const km = n => n==null || n==='' ? '' : nf.format(n);
const byId = (c,id) => S[c].find(x => x.id === id);
const plateHtml = v => v ? `<span class="plate">${esc(v.plate)}</span>` : '<span class="sub">רכב נמחק</span>';
const vName = v => v ? [v.make, v.model].filter(Boolean).join(' ') : '';
const dName = id => { const d = byId('drivers', id); return d ? d.name : ''; };
const opts = (obj, empty) => (empty!=null ? [{v:'',t:empty}] : []).concat(Object.entries(obj).map(([v,t])=>({v,t})));
const vehOpts = (empty, all) => (empty!=null?[{v:'',t:empty}]:[]).concat(sortedVehicles().filter(v=>all||v.status!=='inactive').map(v=>({v:v.id,t:v.plate+' · '+vName(v)})));
const drvOpts = (empty, all) => (empty!=null?[{v:'',t:empty}]:[]).concat([...S.drivers].filter(d=>all||d.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'he')).map(d=>({v:d.id,t:d.name})));
const sortedVehicles = () => [...S.vehicles].sort((a,b)=>String(a.plate).localeCompare(String(b.plate)));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2600); }
function sum(arr,f){ return arr.reduce((a,x)=>a+(Number(f(x))||0),0); }

/* ---------- data ---------- */
const stamp = () => ({updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: user.email});
async function save(col, id, data){
  if (id) await db.collection(col).doc(id).set({...data, ...stamp()}, {merge:true});
  else { const r = await db.collection(col).add({...data, ...stamp(), createdAt: firebase.firestore.FieldValue.serverTimestamp()}); id = r.id; }
  return id;
}
async function bumpKm(vehicleId, k){
  const v = byId('vehicles', vehicleId);
  if (v && k != null && k > (v.km||0)) await db.collection('vehicles').doc(vehicleId).update({km:k, kmDate: today()});
}
function openAssignment(vehicleId){ return S.assignments.find(a => a.vehicleId===vehicleId && !a.end); }
function driverVehicle(driverId){ const a = S.assignments.find(a => a.driverId===driverId && !a.end); return a ? byId('vehicles', a.vehicleId) : null; }
function driverAt(vehicleId, date){
  const a = S.assignments.filter(a => a.vehicleId===vehicleId && a.start<=date && (!a.end || a.end>=date)).sort((x,y)=>y.start.localeCompare(x.start))[0];
  return a ? a.driverId : '';
}
function serviceDue(v){
  const r = S.services.filter(s => s.vehicleId===v.id && (s.nextKm || s.nextDate)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if (!r) return null;
  let level = 'ok', parts = [];
  if (r.nextKm){ const left = r.nextKm - (v.km||0); parts.push(left<0 ? `חריגה של ${km(-left)} ק"מ` : `עוד ${km(left)} ק"מ`); if (left<0) level='bad'; else if (left<=1000) level='warn'; }
  if (r.nextDate){ const d = daysTo(r.nextDate); parts.push(d<0 ? `באיחור ${-d} ימים` : `עד ${fmtD(r.nextDate)}`); if (d<0) level='bad'; else if (d<=30 && level!=='bad') level='warn'; }
  return {level, text: parts.join(' · '), nextKm:r.nextKm, nextDate:r.nextDate};
}
function expLevel(date){ if (!date) return null; const d = daysTo(date); return d<0 ? 'bad' : d<=30 ? 'warn' : 'ok'; }
// 4 bands shown to users: expired / urgent (≤30 days) / soon (31–60) / ok (>60)
function band(date){ if (!date) return ''; const d = daysTo(date); return d<0 ? 'exp' : d<=30 ? 'urg' : d<=60 ? 'soon' : 'ok'; }
function expTag(date, note){
  if (!date) return '<span class="sub">—</span>';
  const d = daysTo(date);
  const label = d<0 ? `פג לפני ${-d} ימים` : d===0 ? 'פג היום' : d===1 ? 'עוד יום אחד' : `עוד ${d} ימים`;
  return `<span class="xp"><span class="b ${band(date)}">${label}</span><span class="sub">${fmtD(date)}${note?' · '+esc(note):''}</span></span>`;
}
// earliest of mandatory / comprehensive insurance
function insDate(v){
  const c = [['חובה',v.insuranceExpiry],['מקיף',v.compExpiry]].filter(x=>x[1]).sort((a,b)=>a[1].localeCompare(b[1]));
  return c.length ? {date:c[0][1], kind: c.length>1 ? c[0][0] : ''} : null;
}
// worst band across test + insurance
function vehicleBand(v){
  const ds = [v.licenseExpiry, v.insuranceExpiry, v.compExpiry].filter(Boolean).sort();
  return ds.length ? band(ds[0]) : '';
}
function alerts(){
  const out = [];
  const add = (level, text, open) => out.push({level, text, open});
  S.vehicles.filter(v=>v.status!=='inactive').forEach(v => {
    [['licenseExpiry','רישיון רכב (טסט)'],['insuranceExpiry','ביטוח חובה'],['compExpiry','ביטוח מקיף']].forEach(([k,label]) => {
      const l = expLevel(v[k]); if (l && l!=='ok') add(l, `${label} — ${daysTo(v[k])<0?'פג תוקף':'מסתיים'} ב-${fmtD(v[k])}`, ['v',v.id]);
    });
    const sd = serviceDue(v); if (sd && sd.level!=='ok') add(sd.level, `טיפול הבא: ${sd.text}`, ['v',v.id]);
  });
  S.drivers.filter(d=>d.active!==false).forEach(d => {
    const l = expLevel(d.licenseExpiry); if (l && l!=='ok') add(l, `רישיון נהיגה של ${d.name} — ${daysTo(d.licenseExpiry)<0?'פג תוקף':'מסתיים'} ב-${fmtD(d.licenseExpiry)}`, ['d',d.id]);
  });
  S.expenses.filter(e=>e.category==='fine' && !e.paid).forEach(e => {
    const l = e.dueDate ? (expLevel(e.dueDate)==='ok' ? 'warn' : expLevel(e.dueDate)) : 'warn';
    add(l, `דוח לא שולם${e.driverId?' ('+dName(e.driverId)+')':''} — ${money(e.amount)}${e.dueDate?' · לתשלום עד '+fmtD(e.dueDate):''}`, ['e',e.id,e.vehicleId]);
  });
  return out.sort((a,b)=> (a.level==='bad'?0:1)-(b.level==='bad'?0:1));
}

/* ---------- generic form ---------- */
let formCtx = null;
function fieldHtml(f, v){
  if (f.sec) return `<div class="sec">${esc(f.sec)}</div>`;
  const id = 'ff_'+f.k, val = v==null ? (f.def ?? '') : v;
  let inp;
  if (f.type==='select') inp = `<select id="${id}" name="${f.k}" ${f.req?'required':''}>${f.opts.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(val)?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`;
  else if (f.type==='textarea') inp = `<textarea id="${id}" name="${f.k}">${esc(val)}</textarea>`;
  else if (f.type==='checkbox') return `<div class="field chk ${f.full?'full':''}"><label><input type="checkbox" id="${id}" name="${f.k}" ${val?'checked':''}> ${esc(f.label)}</label></div>`;
  else inp = `<input id="${id}" name="${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="any" min="0" inputmode="decimal"':''} value="${esc(val)}" ${f.req?'required':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.list?`list="${id}_l" autocomplete="off"`:''}>`
    + (f.list ? `<datalist id="${id}_l">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>` : '');
  return `<div class="field ${f.full?'full':''}"><label for="${id}">${esc(f.label)}${f.req?' *':''}</label>${inp}${f.help?`<div class="sub">${esc(f.help)}</div>`:''}</div>`;
}
function openForm({title, fields, values={}, onSave, onDelete, hint, onInput}){
  formCtx = {fields, onSave, onDelete, onInput};
  $('#fTitle').textContent = title;
  $('#fBody').innerHTML = (hint?`<div class="hint">${hint}</div>`:'') + '<div class="grid2">' + fields.map(f=>fieldHtml(f, values[f.k])).join('') + '</div>';
  $('#fDel').classList.toggle('hidden', !onDelete);
  $('#fSave').disabled = false;
  const d = $('#formDlg'); if (!d.open) d.showModal();
  const first = $('#fBody').querySelector('input,select,textarea'); if (first) first.focus();
}
function readForm(){
  const o = {};
  formCtx.fields.filter(f=>f.k).forEach(f => {
    const el = $('#fBody').querySelector(`[name="${f.k}"]`);
    if (f.type==='checkbox') o[f.k] = el.checked;
    else if (f.type==='number') o[f.k] = el.value==='' ? null : Number(el.value);
    else o[f.k] = el.value.trim();
  });
  return o;
}
$('#fBody').addEventListener('change', e => { if (formCtx && formCtx.onInput) formCtx.onInput(e.target.name, readForm()); });
$('#fForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!e.target.reportValidity()) return;
  $('#fSave').disabled = true;
  try { const r = await formCtx.onSave(readForm()); if (r !== false) { $('#formDlg').close(); toast('נשמר'); } }
  catch(err){ console.error(err); toast('שגיאה בשמירה: '+err.message); }
  finally { $('#fSave').disabled = false; }
});
$('#fDel').addEventListener('click', async () => {
  if (!confirm('למחוק את הרשומה? לא ניתן לשחזר.')) return;
  try { const r = await formCtx.onDelete(); if (r !== false){ $('#formDlg').close(); toast('נמחק'); } } catch(err){ toast('שגיאה: '+err.message); }
});
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

function refreshCard(){ if (!$('#cardDlg').open || !cardCtx) return; setTimeout(()=> cardCtx[0]==='v' ? vehicleCard(cardCtx[1]) : driverCard(cardCtx[1]), 150); }
function fuelStats(vehicleId){
  const f = S.expenses.filter(e=>e.vehicleId===vehicleId && (e.category==='fuel'||e.category==='charge') && e.km && e.liters).sort((a,b)=>a.km-b.km);
  if (f.length < 2) return null;
  const dist = f[f.length-1].km - f[0].km, lit = sum(f.slice(1), x=>x.liters), cost = sum(f.slice(1), x=>x.amount);
  if (dist<=0 || lit<=0) return null;
  return {kmPerL: dist/lit, costPerKm: cost/dist};
}

$('#cBody').addEventListener('click', e => {

    <h2 style="margin-top:22px">הוצאות לפי נהג</h2>
    ${byDrv.length ? `<div class="tbl-wrap"><table><thead><tr><th>נהג</th><th class="num">דלק / טעינה</th><th class="num">אגרה וחניה</th><th class="num">דוחות (מס')</th><th class="num">דוחות (₪)</th><th class="num">סה"כ</th></tr></thead><tbody>
      ${byDrv.map(r=>`<tr><td><button class="lnk" data-drv="${r.id}">${esc(r.name)}</button></td><td class="num">${money(r.fuel)}</td><td class="num">${money(r.roads)}</td><td class="num">${r.finesN}</td><td class="num">${money(r.fines)}</td><td class="num">${money(r.total)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="tbl-wrap"><div class="empty">אין הוצאות משויכות לנהגים בתקופה</div></div>'}
    <p class="sub">טיפולים ותיקונים נספרים לפי רכב בלבד. הוצאות ללא נהג נבחר משויכות אוטומטית לנהג שהחזיק ברכב בתאריך ההוצאה.</p>`;
}

const VIEWS = {dash:renderDash, vehicles:renderVehicles, drivers:renderDrivers, services:renderServices, expenses:renderExpenses, reports:renderReports};
function render(){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab===tab));
  const n = alerts().length, dt = document.querySelector('.tab[data-tab="dash"]');
  dt.innerHTML = 'לוח בקרה' + (n ? `<span class="cnt">${n}</span>` : '');
  const ae = document.activeElement, fid = ae && ae.id, pos = ae && ae.selectionStart;
  $('#view').innerHTML = VIEWS[tab]();
  if (fid && $('#view').querySelector('#'+fid)){ const el = $('#'+fid); el.focus(); try{ if (pos!=null) el.setSelectionRange(pos,pos); }catch(e){} }
  if (cardCtx && $('#cardDlg').open && !$('#formDlg').open) (cardCtx[0]==='v'?vehicleCard:driverCard)(cardCtx[1]);
}
let rq = 0; const schedule = () => { cancelAnimationFrame(rq); rq = requestAnimationFrame(render); };

document.querySelector('.tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t){ tab = t.dataset.tab; try{localStorage.setItem('fleet.tab',tab);}catch(_){} render(); } });
$('#view').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.veh) return vehicleCard(b.dataset.veh);
  if (b.dataset.drv) return driverCard(b.dataset.drv);
  if (b.dataset.srv) return serviceForm(byId('services', b.dataset.srv));
  if (b.dataset.exp) return expenseForm(byId('expenses', b.dataset.exp));
  if (b.dataset.vband){ ui.vband = ui.vband===b.dataset.vband ? '' : b.dataset.vband; return render(); }
  if (b.dataset.vgrp != null){ ui.vgrp = b.dataset.vgrp; return render(); }
  if (b.dataset.vedit) return vehicleForm(byId('vehicles', b.dataset.vedit));
  if (b.dataset.vdel){
    const v = byId('vehicles', b.dataset.vdel); if (!v || !confirm(`למחוק את הרכב ${v.plate}? לא ניתן לשחזר.`)) return;
    return deleteVehicle(v).then(r => { if (r!==false) toast('נמחק'); }).catch(err => toast('שגיאה: '+err.message));
  }
  if (b.id==='vReset'){ Object.assign(ui, {vq:'', vband:'', vcorp:'', vtype:''}); return render(); }
  if (b.dataset.rng){
    const d = new Date(), y = d.getFullYear(), m = d.getMonth();
    const iso = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
    if (b.dataset.rng==='m'){ ui.from = iso(new Date(y,m,1)); ui.to = today(); }
    if (b.dataset.rng==='pm'){ ui.from = iso(new Date(y,m-1,1)); ui.to = iso(new Date(y,m,0)); }
    if (b.dataset.rng==='y'){ ui.from = y+'-01-01'; ui.to = today(); }
    return render();
  }
  ({addV:()=>vehicleForm(), addD:()=>driverForm(), addS:()=>serviceForm(), addE:()=>expenseForm(), xlsRep:exportReport}[b.id]||(()=>{}))();
});
$('#view').addEventListener('input', e => {
  const map = {vq:'vq',vcorp:'vcorp',vtype:'vtype',dq:'dq',sv:'sv',st:'st',ev:'ev',ec:'ec',fFrom:'from',fTo:'to'};
  if (map[e.target.id]){ ui[map[e.target.id]] = e.target.value; render(); }
});

/* ---------- excel ---------- */
function sheet(rows){ const ws = XLSX.utils.json_to_sheet(rows); ws['!views'] = [{RTL:true}]; return ws; }
function exportReport(){
  const {byVeh, byDrv} = reportData(), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(byVeh.map(r=>({'מספר רישוי':r.v.plate,'רכב':vName(r.v),'דלק/טעינה':r.fuel,'ליטרים':r.liters,'טיפולים':r.maint,'אגרה וחניה':r.roads,'דוחות':r.fines,'אחר':r.other,'סה"כ':r.total}))), 'לפי רכב');
  XLSX.utils.book_append_sheet(wb, sheet(byDrv.map(r=>({'נהג':r.name,'דלק/טעינה':r.fuel,'אגרה וחניה':r.roads,'מספר דוחות':r.finesN,'דוחות':r.fines,'סה"כ':r.total}))), 'לפי נהג');
  XLSX.writeFile(wb, `דוח-צי-רכב_${ui.from}_${ui.to}.xlsx`);
}
function exportAll(){
  const wb = XLSX.utils.book_new(), P = id => (byId('vehicles',id)||{}).plate || '';
  XLSX.utils.book_append_sheet(wb, sheet(sortedVehicles().map(v=>({'מספר רישוי':v.plate,'יצרן':v.make,'דגם':v.model,'שנה':v.year,'צבע':v.color,'הנעה':FUEL[v.fuel],'בעלות':OWN[v.ownership],'ליסינג/בעלים':v.leaseCompany,'סוג כלי':v.vtype,'קבוצה':v.group,'תאגיד':v.corp,'שימוש':v.usage,'סטטוס':VSTAT[v.status],'ק"מ':v.km,'טסט עד':v.licenseExpiry,'ביטוח חובה עד':v.insuranceExpiry,'מקיף עד':v.compExpiry,'נהג נוכחי':dName((openAssignment(v.id)||{}).driverId),'הערות':v.notes}))), 'רכבים');
  XLSX.utils.book_append_sheet(wb, sheet(S.drivers.map(d=>({'שם':d.name,'ת"ז/מס עובד':d.idNumber,'טלפון':d.phone,'אימייל':d.email,'מחלקה':d.department,'מס רישיון':d.licenseNumber,'דרגה':d.licenseClass,'רישיון עד':d.licenseExpiry,'פעיל':d.active===false?'לא':'כן','הערות':d.notes}))), 'נהגים');
  XLSX.utils.book_append_sheet(wb, sheet([...S.assignments].sort((a,b)=>a.start.localeCompare(b.start)).map(a=>({'רכב':P(a.vehicleId),'נהג':dName(a.driverId),'מתאריך':a.start,'ק"מ במסירה':a.startKm,'עד תאריך':a.end,'ק"מ בהחזרה':a.endKm,'הערות':[a.notes,a.returnNotes].filter(Boolean).join(' · ')}))), 'שיוכים');
  XLSX.utils.book_append_sheet(wb, sheet([...S.services].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>({'תאריך':s.date,'רכב':P(s.vehicleId),'סוג':STYPE[s.type],'ק"מ':s.km,'מוסך':s.garage,'חשבונית':s.invoice,'תיאור':s.description,'עלות':s.cost,'טיפול הבא ק"מ':s.nextKm,'טיפול הבא תאריך':s.nextDate}))), 'טיפולים');
  XLSX.utils.book_append_sheet(wb, sheet([...S.expenses].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>({'תאריך':e.date,'רכב':P(e.vehicleId),'סוג':ECAT[e.category],'נהג':dName(e.driverId),'סכום':e.amount,'ק"מ':e.km,'ליטרים':e.liters,'ספק':e.supplier,'לתשלום עד':e.dueDate,'שולם':e.category==='fine'?(e.paid?'כן':'לא'):'','הערות':e.notes}))), 'הוצאות');
  XLSX.writeFile(wb, `גיבוי-צי-רכב_${today()}.xlsx`);
}
$('#backupBtn').onclick = exportAll;

/* ---------- auth ---------- */
document.querySelectorAll('.co-name').forEach(e => e.textContent = COMPANY);
$('#yr').textContent = new Date().getFullYear();
try { const t = localStorage.getItem('fleet.tab'); if (t && VIEWS[t]) tab = t; } catch(_){}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#lErr').textContent = '';
  try { await auth.signInWithEmailAndPassword($('#lEmail').value.trim(), $('#lPass').value); }
  catch(err){ $('#lErr').textContent = /invalid|wrong|not-found|credential/.test(err.code||'') ? 'אימייל או סיסמה שגויים' : 'שגיאה בכניסה: ' + err.message; }
});
$('#forgotBtn').onclick = async () => {
  const em = $('#lEmail').value.trim(); if (!em){ $('#lErr').textContent = 'הזן אימייל ואז לחץ שוב'; return; }
  try { await auth.sendPasswordResetEmail(em); } catch(_){}
  $('#lErr').textContent = 'אם הכתובת רשומה, נשלח אליה קישור לאיפוס סיסמה';
};
$('#logoutBtn').onclick = () => auth.signOut();
auth.onAuthStateChanged(u => {
  user = u; unsubs.forEach(f=>f()); unsubs = [];
  $('#login').classList.toggle('hidden', !!u); $('#app').classList.toggle('hidden', !u);
  if (!u){ COLS.forEach(c => S[c] = []); return; }
  $('#who').textContent = u.email;
  COLS.forEach(c => unsubs.push(db.collection(c).onSnapshot(snap => {
    S[c] = snap.docs.map(d => ({id:d.id, ...d.data()})); schedule();
  }, err => { console.error(c, err); toast('אין הרשאה לנתונים — פנה למנהל המערכת'); })));
  render();
});
</script>
<script src="import.js"></script>
</body>
